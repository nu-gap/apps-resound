#
# Continuous build of the GNUstep port of Resound (branch gnustep-port).
#
# The app is built with the same toolchain the port targets:
#   clang + libobjc2 (gnustep-2.2, non-fragile ABI), library combo
#   ng-gnu-gnu, on a source-built GNUstep stack (gnustep-make,
#   gnustep-base, gnustep-gui, gnustep-back) installed into a hermetic
#   prefix - mirroring the Gershwin /System reference install on the
#   developer machine, which the packaged GNUstep (apt) cannot provide,
#   as it is built against GCC's libobjc instead of libobjc2.
#
# The stack versions are pinned to the same source commits as the
# Gershwin install (see /Developer/Library/Repositories.csv on the dev
# box).  To update the stack, bump the pins and GNUSTEP_STACK_REV
# (which invalidates the cache).
#
name: Build

on:
  push:
    # The screenshot step publishes to this branch with the workflow
    # token; exclude it so the bot's own pushes do not re-trigger the
    # build (see docs/README_SCREENSHOT.md).
    branches-ignore:
      - screenshot
  pull_request:
  workflow_dispatch:

# The screenshot step pushes its result to the 'screenshot' branch with
# the per-run GITHUB_TOKEN, which is read-only by default; grant write
# (see docs/README_SCREENSHOT.md for the mechanics).
permissions:
  contents: write

env:
  GNUSTEP_PREFIX: ${{ github.workspace }}/gnustep

jobs:
  # The GNUmakefile-based build system only exists on branches that
  # contain the port.  The usual way to test for a file in an "if"
  # condition - hashFiles() - is a runner-side function and is only
  # permitted in step-level "if" conditions, not in a job-level one, so
  # this cheap gate job does the check on the runner and exposes the
  # result as an output.  The build job then skips itself where the
  # build system is absent (e.g. a pull request from a pre-port branch)
  # instead of spending the 20-35 minute stack build only to fail at
  # 'make -f GNUmakefile'.
  check:
    name: Detect the GNUstep build system
    runs-on: ubuntu-24.04
    outputs:
      has_build_system: ${{ steps.detect.outputs.has_build_system }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Look for the GNUmakefile
        id: detect
        run: |
          if [ -f GNUmakefile ]; then
            echo "has_build_system=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build_system=false" >> "$GITHUB_OUTPUT"
            echo "No GNUmakefile - this branch predates the GNUstep port; skipping the build."
          fi

  build:
    name: Resound (GNUstep, clang/libobjc2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: check
    if: needs.check.outputs.has_build_system == 'true'
    env:
      # Bump when the pinned commits below or the port patches applied to
      # them (patches/GNUstep-*.diff) change (invalidates the cache).
      GNUSTEP_STACK_REV: "4"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # third_party/MusicKit (the SndKit source) is a pinned
          # submodule.
          submodules: true

      - name: Restore GNUstep stack (cache)
        id: gnustep-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GNUSTEP_PREFIX }}
          key: gnustep-stack-${{ env.GNUSTEP_STACK_REV }}-noble

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Both x11 tool packages are needed, and both are non-optional:
          # x11-xserver-utils provides xsetroot (the scene background
          # paint - without it the backdrop silently stays the X server's
          # black), and x11-utils provides xwininfo, which the capture
          # step's IsViewable verification uses - its absence makes every
          # window report as unmapped, so no scene can ever verify.
          # (A comment may sit above this statement, but never in the
          # middle of the backslash chain below: bash ends the logical
          # line at '#', which would truncate the install.)
          sudo apt-get install -y --no-install-recommends \
            clang llvm cmake git \
            autoconf automake libtool pkg-config \
            libfontconfig-dev libfreetype-dev \
            libx11-dev libxext-dev libxmu-dev libxft-dev \
            libxcursor-dev libxrandr-dev libxfixes-dev \
            libicu-dev \
            libjpeg-dev libpng-dev libtiff-dev libxml2-dev \
            libgnutls28-dev libxslt1-dev \
            portaudio19-dev libsndfile1-dev libportmidi-dev libasound2-dev \
            xvfb openbox fonts-dejavu-core x11-utils x11-xserver-utils \
            imagemagick xdotool

      - name: Build GNUstep stack from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          # set -e/-x/pipefail, but deliberately NOT -u: the GNUstep
          # scripts sourced below (GNUstep.sh & co.) reference
          # shell-variant variables like $ZSH_VERSION that are unset
          # under bash, and are not hardened for 'set -u'.  (Gershwin's
          # own install scripts source them under plain 'set -e'.)
          set -exo pipefail
          PREFIX="$GNUSTEP_PREFIX"
          SRC="$RUNNER_TEMP/gnustep-sources"
          rm -rf "$PREFIX" "$SRC"
          mkdir -p "$PREFIX" "$SRC"
          cd "$SRC"

          # $1 = owner/repo, $2 = full commit sha.  The download name is
          # the bare repo name: '-o' does not create parent directories,
          # so the 'owner/repo' path form would fail with a curl write
          # error.  (tar extracts to '<repo>-<sha>/' regardless.)
          fetch() {
            local repo="$1" sha="$2"
            curl -fsSL -o "${repo##*/}.tar.gz" "https://github.com/$repo/archive/$sha.tar.gz"
            tar xzf "${repo##*/}.tar.gz"
          }

          # 1. libobjc2 - the GNUstep Objective-C runtime (CMake build).
          #    Built first so that gnustep-make's configure can detect it
          #    (ng runtime) and link its blocks test against it.
          #
          #    GNUSTEP_INSTALL_TYPE=NONE, deliberately not SYSTEM: the
          #    SYSTEM domain asks 'gnustep-config' (from gnustep-make,
          #    built next - it does not exist yet) for the install paths,
          #    and when the program is missing CMake 3.28+ fails with
          #    "install FILES given no DESTINATION".  NONE installs
          #    relative to CMAKE_INSTALL_PREFIX (bin/, lib/, include/) -
          #    exactly the same hermetic layout the SYSTEM domain would
          #    give once this prefix is in place.
          fetch gnustep/libobjc2 c9f4002ade04d755f2a0e6c83daf2738dca03759
          cd libobjc2-c9f4002ade04d755f2a0e6c83daf2738dca03759
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DGNUSTEP_INSTALL_TYPE=NONE \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DTESTS=OFF
          cmake --build build -j"$(nproc)"
          cmake --install build
          cd "$SRC"

          # 2. gnustep-make (the makefiles, GNUstep.sh, gnustep-config,
          #    plmerge, pl2link, ...).  ng-gnu-gnu = gnustep (libobjc2)
          #    runtime + GNUstep base + GNUstep gui.
          fetch gnustep/tools-make 4e31a0310df5f0aa96ccd816d3b626e67c36f535
          cd tools-make-4e31a0310df5f0aa96ccd816d3b626e67c36f535
          # Make the just-installed libobjc2 discoverable to configure:
          # its run tests need the shared library at runtime, and its
          # pkg-config probe needs the .pc file.  (Later components get
          # this automatically from the prefix's GNUstep.sh, which does
          # not exist yet - it is installed by this very step.)
          export LD_LIBRARY_PATH="$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure \
            --prefix="$PREFIX" \
            --with-library-combo=ng-gnu-gnu \
            --with-runtime-abi=gnustep-2.2 \
            CC=clang CXX=clang++ \
            CPPFLAGS="-I$PREFIX/include" LDFLAGS="-L$PREFIX/lib"
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # From here on, everything configures against the freshly
          # installed stack: its GNUstep.sh points at the prefix.
          export GNUSTEP_CONFIG_FILE="$PREFIX/etc/GNUstep/GNUstep.conf"
          . "$PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM

          # 3. gnustep-base (Foundation).
          fetch gnustep/libs-base 5bda52220a6d67382c9851cdfd91d459bfd2b489
          cd libs-base-5bda52220a6d67382c9851cdfd91d459bfd2b489
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure --disable-libdispatch CC=clang CXX=clang++
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # 4. gnustep-gui (AppKit).
          fetch gnustep/libs-gui 8f804fd520c60800961e0bee072066f4bbadca94
          cd libs-gui-8f804fd520c60800961e0bee072066f4bbadca94
          # Port patches (patches/GNUstep-0002/0003, documented in
          # docs/UPSTREAM_PATCHES.md): the pasteboard wrapper/target
          # lifetimes, and deterministic .gorm serialization of the
          # container's top-level collections.  (GNUstep-0001, the
          # released-when-closed default, was retired 2026-11-11: the
          # maintainer declined the change, and the audit of the built
          # sources shows nothing the build compiles needs it - see
          # the G1 section.)  Failing to apply fails the build, like
          # the MusicKit patches (set -e above).
          patch -p1 --dry-run < "${GITHUB_WORKSPACE}/patches/GNUstep-0002-nspasteboard-retained-wrapper-map.diff"
          patch -p1 --dry-run < "${GITHUB_WORKSPACE}/patches/GNUstep-0003-gsnibcontainer-deterministic-serialization.diff"
          patch -p1 --forward < "${GITHUB_WORKSPACE}/patches/GNUstep-0002-nspasteboard-retained-wrapper-map.diff"
          patch -p1 --forward < "${GITHUB_WORKSPACE}/patches/GNUstep-0003-gsnibcontainer-deterministic-serialization.diff"
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure CC=clang CXX=clang++
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # 5. gnustep-back (X11 backend; needed for the launch check).
          fetch gnustep/libs-back bbcc3de7cab63b6e65944edf02f2bbef9d8a7bbd
          cd libs-back-bbcc3de7cab63b6e65944edf02f2bbef9d8a7bbd
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure CC=clang CXX=clang++
          make -j"$(nproc)"
          make install

          # Sanity: the runtime pieces must be in the prefix.
          ls "$PREFIX/lib" | grep -E "^(libobjc|libgnustep)" | sort

      - name: Save GNUstep stack (cache)
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GNUSTEP_PREFIX }}
          key: gnustep-stack-${{ env.GNUSTEP_STACK_REV }}-noble

      - name: Build SndKit frameworks (MusicKit)
        # SndKit + its portaudio performance backend, from the pinned
        # third_party/MusicKit submodule (see docs/GNUSTEP_BUILD.md).
        #
        # This runs *after* the cache save on purpose: the frameworks
        # install into the same hermetic prefix, and keeping them out of
        # the cached prefix means every run builds them fresh from the
        # pinned submodule (a couple of minutes) instead of trusting a
        # cached copy that would go stale when the submodule is bumped.
        # The expensive stack (above) stays cached.
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables
          # (see the stack build step).
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          bash third_party/build-sndkit.sh

      - name: SndKit smoke test
        # Functional check of the freshly built frameworks: load a
        # .wav, write an .au, reload it - pure libsndfile file I/O, no
        # audio device or display needed, so it is safe to make fatal.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name sndsmoke | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          OUT="$RUNNER_TEMP/sndsmoke-out.au"
          "$TOOL" test/Tone.wav "$OUT"
          ls -la "$OUT"

      - name: File I/O contract tests (Phase 1)
        # The Sound (ResoundSound) category's intended behaviour, pinned
        # test-first by test/resoundio.m (the Rhapsody original cannot
        # run, so the tests define the SndKit contract; see
        # docs/RESOUND_SNDKIT_PLAN.md, Phase 1): loading every format,
        # the convertOnOpen normalisation, save/backup/info-string
        # round trips and the failure paths.  Headless and fatal.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundio | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          WORK="$RUNNER_TEMP/resoundio"
          mkdir -p "$WORK"
          "$TOOL" test/Tone.wav "$WORK"

      - name: Build the app
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables
          # (see the stack build step).
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          make -j"$(nproc)" -f GNUmakefile
          find Resound.app -maxdepth 3 | sort

      - name: Build the modules (Phase 3)
        # The ported modules so far - Zero, the first Phase 3 unit,
        # Mix, the second, Envelope, the third, EchoChamber, the
        # fourth, and Gate, the fifth (Envelope, EchoChamber and
        # Gate are the three with a control-panel nib: the bundles
        # carry the gorms at their resource root, the way the
        # app's own bundle carries its gorms): gnustep-make bundles
        # (gnustep-make bundle.make rules, ADR 0020) producing
        # Zero.rmod, Mix.rmod, Envelope.rmod, EchoChamber.rmod and
        # Gate.rmod, installed into the
        # domain's library directory (lib/GNUstep/Resound with the
        # fhs filesystem layout) - the app's ModuleController searches
        # every library domain + /Resound (plus the app bundle), so
        # the installed modules are found when the app starts: the
        # launch check and the capture below then run with the
        # "Modules" menu live.  Fatal, like the app build.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          make -C Source/Modules/Zero -j"$(nproc)" -f GNUmakefile
          make -C Source/Modules/Zero -f GNUmakefile install
          find Source/Modules/Zero/Zero.rmod -maxdepth 3 | sort
          make -C Source/Modules/Mix -j"$(nproc)" -f GNUmakefile
          make -C Source/Modules/Mix -f GNUmakefile install
          find Source/Modules/Mix/Mix.rmod -maxdepth 3 | sort
          make -C Source/Modules/Envelope -j"$(nproc)" -f GNUmakefile
          make -C Source/Modules/Envelope -f GNUmakefile install
          find Source/Modules/Envelope/Envelope.rmod -maxdepth 3 | sort
          make -C Source/Modules/EchoChamber -j"$(nproc)" -f GNUmakefile
          make -C Source/Modules/EchoChamber -f GNUmakefile install
          find Source/Modules/EchoChamber/EchoChamber.rmod -maxdepth 3 | sort
          make -C Source/Modules/Gate -j"$(nproc)" -f GNUmakefile
          make -C Source/Modules/Gate -f GNUmakefile install
          find Source/Modules/Gate/Gate.rmod -maxdepth 3 | sort
          ls -la "$GNUSTEP_PREFIX/lib/GNUstep/Resound"

      - name: Module load contract (Phase 3)
        # The ported modules, headless and fatal (test/resoundmodule;
        # the tool dispatches on the bundle's principal class, exactly
        # like the app's loadAModule:).  For Zero: the built
        # Zero.rmod through NSBundle - the principal class (ZeroModule,
        # via the generated Info-gnustep.plist), the menu tree the
        # app's "Modules" menu is built from, and zeroSound: over the
        # five 1998 data formats (mono and stereo), the buffer
        # checked to be exactly zeroed.  For Mix: the same
        # principal-class and menu checks (one "Mix In" leaf
        # targeting mix:), then mix: itself - first with an empty
        # pasteboard (a no-op: the document must stay untouched) and
        # then with a source selection on the pasteboard mixed into
        # the document selection over the five 1998 data formats,
        # mono and stereo, the expected values computed through
        # SndKit's own conversions plus the 1998 per-format DSP.
        # For Envelope: the same principal-class and menu checks
        # (one "Envelope" leaf targeting showEnvelopePanel:), then
        # showEnvelopePanel: and applyEnvelope: - the fade in/out
        # DSP - over the five 1998 data formats, mono and stereo,
        # with the panel's six outlets as fakes (pre-setting the
        # panel outlet skips the nib load, which needs a display and
        # runs in the app; the probe below drives it there for
        # real).  No pasteboard involved in the Envelope cases.
        # For EchoChamber: the same principal-class and menu checks
        # (one "Echo Chamber..." leaf targeting begin:), then begin:
        # with the panel outlet as a fake and the windowLoaded flag
        # pre-set (skipping the nib load, which needs a display and
        # runs in the app; the probe below drives it there for real),
        # then performEcho: - the echo DSP - on conforming mono/
        # 16-bit/44.1k sounds (the one shape the 1998 method accepts
        # without its modal conversion prompt), the five panel value
        # outlets as fakes, the expected buffer computed with the
        # module's own echo arithmetic, and the setSound:/
        # newSound:for: hand-off of the freshly built sound checked.
        # For Gate: the same principal-class and menu checks (one
        # "Noise Gate..." leaf targeting showNoiseGatePanel:), then
        # showNoiseGatePanel: with the panel outlets as fakes and
        # the nib_loaded flag pre-set (skipping the nib load, which
        # needs a display and runs in the app; the probe below
        # drives it there for real), then gateIt: - the noise gate
        # DSP - over the five 1998 data formats, mono and stereo,
        # whole-sound and partial selections, the expected buffer
        # computed with the module's own per-channel gate state
        # machine and the panel floats checked to derive the 1998
        # state counts.  No pasteboard involved in the Envelope,
        # EchoChamber or Gate cases.  The mix cases use the general
        # pasteboard for real:
        # GNUstep's client auto-launches a fresh gpbs when no
        # pasteboard server runs (filesystem name transport, no other
        # daemon needed), which is empty - the state the no-op case
        # asserts - and stops again when the tool exits, leaving CI
        # clean.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundmodule | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$TOOL" Source/Modules/Zero/Zero.rmod
          "$TOOL" Source/Modules/Mix/Mix.rmod
          "$TOOL" Source/Modules/Envelope/Envelope.rmod
          "$TOOL" Source/Modules/EchoChamber/EchoChamber.rmod
          "$TOOL" Source/Modules/Gate/Gate.rmod

      - name: Module load probe (Phase 3)
        # The app-side half of the module load, run for real (test/
        # resoundmenu, non-fatal like the launch check): it loads the
        # built app's main model the way NSApplicationMain does, then
        # posts NSApplicationDidFinishLaunching so the app's real
        # launch path runs - ModuleController loadModules, which
        # searches the library domains for *.rmod bundles, dlopens
        # them, and builds their menu trees.  The assertion is the
        # menu dump: "Zero", "Mix In" and "Envelope" must appear in
        # the after-launch menu (the 1998 model ships with an empty
        # Modules menu, so the entries can only come from the
        # installed Zero.rmod / Mix.rmod / Envelope.rmod /
        # EchoChamber.rmod).
        # --perform Envelope then performs that leaf's action (the
        # user-click equivalent) and asserts the panel window: the
        # lazy nib load (ResoundNibs -> the bundle's gorm) is the one
        # step a menu dump cannot see - a broken gorm placement
        # would surface only as the 1998 alert and a missing panel.
        # --perform "Echo Chamber..." runs the same for the second
        # gorm module: the EchoChamber panel (title "Echo Chamber")
        # must come up visible from the bundle's gorm.
        # --perform "Noise Gate..." runs the same for the third gorm
        # module: the Gate panel (title "Noise Gate") must come up
        # visible from the bundle's gorm.
        # Non-fatal: a display environment can not be trusted the way
        # the build can be; the load contract above (headless) is the
        # hard gate.
        continue-on-error: true
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundmenu | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          LOG=$(mktemp)
          rc=0
          timeout 90 xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$TOOL" Resound.app --perform Envelope >"$LOG" 2>&1 || rc=$?
          cat "$LOG"
          test "$rc" -eq 0
          grep -q "loadNibFile Resound: ok" "$LOG"
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Zero"
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Mix In"
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Envelope"
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Echo Chamber..."
          awk '/performing Envelope/{f=1} f' "$LOG" | grep -q "window: 'Envelope 1.0' visible=1"
          LOG=$(mktemp)
          rc=0
          timeout 90 xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$TOOL" Resound.app --perform "Echo Chamber..." >"$LOG" 2>&1 || rc=$?
          cat "$LOG"
          test "$rc" -eq 0
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Echo Chamber..."
          awk '/performing Echo Chamber/{f=1} f' "$LOG" | grep -q "window: 'Echo Chamber' visible=1"
          LOG=$(mktemp)
          rc=0
          timeout 90 xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$TOOL" Resound.app --perform "Noise Gate..." >"$LOG" 2>&1 || rc=$?
          cat "$LOG"
          test "$rc" -eq 0
          awk '/AFTER launch/{f=1} f' "$LOG" | grep -q "Noise Gate..."
          awk '/performing Noise Gate/{f=1} f' "$LOG" | grep -q "window: 'Noise Gate' visible=1"

      - name: NIB conversion format check
        # Every 1998 .nib in the tree has a converted .gorm twin
        # (gormtool, gnustep/apps-gorm branch OPENSTEP_nib_support); the
        # 1998 folders stay in place as the source of the stepwise
        # re-nib migration.  This verifies the asset format - the GNUstep
        # archive magic and the class description of every .gorm, in the
        # tree and in the freshly built bundle.  Headless and fatal.
        # (The runtime load half of the test, --load, needs a display and
        # runs locally; see docs/RESOUND_SNDKIT_PLAN.md, NIB migration.)
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundnib | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$TOOL" --check . Resound.app/Resources

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Resound.app
          path: Resound.app

      - name: Launch check (non-fatal)
        # The app starts with its 1998 main window (the converted main
        # model is live at startup) and then just sits in its event loop
        # until the timer fires: exit 124 is a pass.
        # Non-fatal for now so that a flaky display environment can not
        # mask a build result; the build step is the hard gate.
        #
        # openbox provides the window manager that bare xvfb lacks:
        # gnustep-back waits for the WM to map the window (and queries
        # its _NET_WORKAREA), logging a warning per second without one.
        # With a minimal WM the check measures what a real desktop does
        # (a mapped, visible window) - what will matter once the app
        # has its main nib.  Killing the app from the outside (timeout)
        # always leaves a cosmetic 'XIO: fatal IO error' line from
        # libX11; that is teardown noise, not a failure.
        continue-on-error: true
        run: |
          EXE=$(find Resound.app -type f -name Resound | head -n 1)
          test -n "$EXE"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rc=0
          timeout 10 xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$EXE" || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "launch check passed (rc=$rc)"
          else
            echo "launch check failed (rc=$rc)"
            exit "$rc"
          fi

      - name: Capture app screenshot (for the README)
        # The real app under xvfb + openbox; the *whole screen* is
        # captured with ImageMagick, so that every window the app shows
        # up is in the picture.  Before the capture the step stages a
        # scene: the app is launched with test/Tone.wav as a file
        # argument (GNUstep hands non-dash arguments to
        # application:openFile:, so it comes up with the tone as an
        # open document), the 1998 menu bar is moved aside, and two
        # menu selections open their panels (Tools -> Record Format,
        # Edit -> Preferences, driven by xdotool mouse events on the
        # bar); the five windows are then tiled across the canvas.  The
        # root window is painted the brand purple (xsetroot) so the
        # inter-window gaps read as a backdrop instead of Xvfb black.
        # The Record panel is an openbox-managed window whose placement
        # openbox chooses, so it is moved to its tile spot right after
        # it opens (before the Edit dance) - where it sits it could
        # otherwise swallow the press or release of that dance.
        # The same capture shows the UI further as the ported units
        # land; the publish step below ships the PNG to the
        # 'screenshot' branch that the README links
        # (docs/README_SCREENSHOT.md).  Non-fatal, like the launch
        # check: a flaky display must not mask a build result.  Every
        # scene step is best effort, so a flaky piece degrades the
        # picture (fewer windows) instead of the build.  (A per-window
        # capture does not work: app windows can fail ImageMagick
        # XGetImage with a bad resource while the root window is always
        # capturable.)
        continue-on-error: true
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables.
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          EXE=$(find Resound.app -type f -name Resound | head -n 1)
          test -n "$EXE"
          test -f test/Tone.wav
          OUT="$RUNNER_TEMP/Resound-screenshot.png"
           timeout 540 xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
             set -x
             openbox >/dev/null 2>&1 &
             sleep 1
             # Scene background: the X server leaves the root window black and
             # openbox does not paint it, so set the brand purple
             # (102,102,149 = #666695) before anything maps.
             if command -v xsetroot >/dev/null 2>&1; then
               xsetroot -solid "#666695" 2>/dev/null || echo "SCENE: xsetroot failed - the backdrop will be black"
             else
               echo "SCENE: xsetroot not installed (x11-xserver-utils) - the backdrop will be black"
             fi

             # top_id PATTERN: the top-level (frame) id among the name matches.
             # A reparented client and its frame share the name, but the frame
             # is taller - and windowmove must hit the frame, since the client
             # id would only shift inside it under a plain WM.
             top_id() {
               local id best="" bh=0
               for id in $(xdotool search --name "$1" 2>/dev/null); do
                 eval "$(xdotool getwindowgeometry --shell "$id" 2>/dev/null)"
                 if [ "${HEIGHT:-0}" -gt "$bh" ]; then bh=${HEIGHT:-0}; best=$id; fi
               done
               echo "$best"
             }
             tile() {
               local id
               id=$(top_id "$1")
               if [ -n "$id" ]; then
                 xdotool windowmove "$id" "$2" "$3"
               else
                 echo "tile: no window matching [$1]"
               fi
             }

             # px PNG X Y: the pixel at X,Y as "r g b".
             px() {
               convert "$1" -crop 1x1+$2+$3 +repage txt:- 2>/dev/null | tail -n 1 \
                 | sed -n "s/.*(\([0-9][0-9]*\),\([0-9][0-9]*\),\([0-9][0-9]*\)).*/\1 \2 \3/p"
             }
             # check_capture PNG: the frame must actually show the staged
             # scene.  The top corners (no window covers them) must be the
             # brand purple; the bar, the tone document, and the
             # preferences panel must be visible (non-purple) at their
             # tile spots.  An all-purple frame means the screen buffer
             # was read before the windows drew, an all-black one means
             # the backdrop was lost; both are broken captures, not
             # scenes.  Tolerance is +/-3 per channel on 102,102,149.
             check_capture() {
               local c r rest g b p fail=0
               c=$(px "$1" 5 5)
               r=${c%% *}; rest=${c#* }; g=${rest%% *}; b=${rest#* }
               { [ "${r:-0}" -lt 99 ] || [ "${r:-99}" -gt 105 ] \
                 || [ "${g:-0}" -lt 99 ] || [ "${g:-99}" -gt 105 ] \
                 || [ "${b:-0}" -lt 146 ] || [ "${b:-99}" -gt 152 ]; } \
                 && fail=1
               for p in "1050 320" "60 80" "700 100"; do
                 c=$(px "$1" $p)
                 r=${c%% *}; rest=${c#* }; g=${rest%% *}; b=${rest#* }
                 { [ "${r:-0}" -ge 99 ] && [ "${r:-0}" -le 105 ] \
                   && [ "${g:-0}" -ge 99 ] && [ "${g:-0}" -le 105 ] \
                   && [ "${b:-0}" -ge 146 ] && [ "${b:-0}" -le 152 ]; } \
                   && fail=1
               done
               if [ "$fail" -eq 1 ]; then
                 echo "CAPTURE: frame check failed (backdrop or windows missing) - recapturing"
                 return 1
               fi
               return 0
             }

             # viewable_id PATTERN: like xdotool search, but a name match only
             # counts when the window is actually mapped (IsViewable) - a
             # hidden or off-canvas window does not count for verification.
             viewable_id() {
               local id st
               for id in $(xdotool search --name "$1" 2>/dev/null); do
                 st=$(xwininfo -id "$id" 2>/dev/null | grep -oE "IsViewable" | head -n 1 || true)
                 if [ -n "$st" ]; then echo "$id"; return 0; fi
               done
               return 1
             }

             # pick_popup XLO XHI YLO YHI HLO HHI: among the windows new since
             # the baseline (the menu popups are nameless), in the given band,
             # return the VIEWABLE one with the greatest height.  The Edit menu
             # renders in a 147x362 (17-row) and a 170x302 (14-row) twin in the
             # same session, and which twin is viewable varies run to run (a
             # GUI-library layout race at nib-load time); the 14-row twin makes
             # the last menu row - Preferences - unreachable.  Preferring the
             # tallest viewable twin takes the 17-row layout whenever it is
             # viewable.  Sets SUB/SX/SY/SW/SH (empty when none is viewable).
             pick_popup() {
               local id st sub="" bh=0
               SUB=""; SX=0; SY=0; SW=0; SH=0
               xdotool search --name "" 2>/dev/null | sort -n > /tmp/resound-shot-press.txt
               for id in $(comm -13 /tmp/resound-shot-baseline.txt /tmp/resound-shot-press.txt); do
                 eval "$(xdotool getwindowgeometry --shell "$id" 2>/dev/null)"
                 # Filter on the cheap geometry first: a press spawns
                 # hundreds of 1x1 helper windows in the popup zone, and
                 # xwininfo (one fork per window) is the expensive call.
                 if [ "${X:-0}" -lt $1 ] || [ "${X:-0}" -gt $2 ] \
                   || [ "${Y:-0}" -lt $3 ] || [ "${Y:-0}" -gt $4 ] \
                   || [ "${HEIGHT:-0}" -lt $5 ] || [ "${HEIGHT:-0}" -gt $6 ]; then
                   continue
                 fi
                 st=$(xwininfo -id "$id" 2>/dev/null | grep -oE "IsViewable" | head -n 1 || true)
                 if [ -n "$st" ] && [ "${HEIGHT:-0}" -gt "$bh" ]; then
                   SUB=$id; SX=${X:-0}; SY=${Y:-0}; SW=${WIDTH:-0}; SH=${HEIGHT:-0}; bh=${HEIGHT:-0}
                 fi
               done
             }

             # dance ROW HLO HHI: press bar row ROW (0 = Resound; rows sit 20px
             # apart, 11px below the bar top) and slide down one row - the 1998
             # bar then attaches the submenu at (barX+86, barY) - and release on
             # the LAST row of the selected popup: the target item is the last
             # row of both menus, so the exact row height does not matter.
             # The app blocks its event loop for several seconds after the bar
             # maps (module loading, audio probing), so an early press can be
             # swallowed: retry until a viewable popup actually appears.
             dance() {
               local row=$1 hlo=$2 hhi=$3 attempt=0
               while [ $attempt -lt 8 ] && [ -z "$SUB" ]; do
                 attempt=$((attempt+1))
                 xdotool mousemove $((X0+43)) $((Y0+11+20*row)) mousedown 1
                 sleep 0.4
                 xdotool mousemove $((X0+43)) $((Y0+31+20*row))
                 sleep 1.2
                 pick_popup $((X0+80)) $((X0+110)) $((Y0-5)) $((Y0+5)) $hlo $hhi
                 if [ -n "$SUB" ]; then
                   # Pure-server raise: openbox does not manage the
                   # override-redirect popup, so XRaiseWindow pins it above
                   # whatever the app or the WM stacked over it - and again
                   # after the aim move, in case the pointer travel made the
                   # WM raise a managed window over it.
                   xdotool windowraise "$SUB" 2>/dev/null || true
                   echo "dance: viewable popup $SUB ${SW}x${SH} on press attempt $attempt"
                   xdotool mousemove $((SX+SW/2)) $((SY+SH-5))
                   xdotool windowraise "$SUB" 2>/dev/null || true
                 else
                   echo "dance: no viewable popup on press attempt $attempt - retrying"
                   xdotool mouseup 1
                   sleep 2
                   # Re-baseline the window list: each press leaves its helper
                   # windows behind, and without this the diff above would grow
                   # (and slow down) on every attempt.
                   xdotool search --name "" 2>/dev/null | sort -n > /tmp/resound-shot-baseline.txt
                 fi
               done
               if [ -z "$SUB" ]; then
                 xdotool mouseup 1
                 return 1
               fi
               sleep 0.3
               xdotool mouseup 1
               sleep 1
             }

             # scene: one full app launch, staged and captured.  Returns 0 only
             # when the verified elements are all present: the menu bar, the
             # Record panel, and - the element that has been missing from the
             # published image - the Preferences panel.  A failed scene means
             # the app is relaunched (a new nib load re-rolls the 14/17-row
             # layout race); five failures mean no screenshot is written at
             # all, so the publish gate keeps the last published image rather
             # than shipping a degraded one.
             scene() {
               "$1" "$2" >/dev/null 2>&1 &
               local app=$!

               # Readiness gate: wait for the app to have at least one window,
               # then for the tone document window (a missing document only
               # thins the scene - not a verification failure).
               local ready=0 i
               for i in $(seq 1 40); do
                 if [ -n "$(xdotool search --name Resound 2>/dev/null | head -n 1 || true)" ]; then
                   ready=1
                   break
                 fi
                 sleep 0.5
               done
               if [ "$ready" -ne 1 ]; then
                 echo "SCENE: no app window appeared"
                 kill "$app" 2>/dev/null || true
                 return 1
               fi
               for i in $(seq 1 40); do
                 if [ -n "$(xdotool search --name "Tone.wav" 2>/dev/null | head -n 1 || true)" ]; then
                   break
                 fi
                 sleep 0.5
               done
               sleep 1

               # The 1998 menu bar: the only ~86x182 window named Resound.
               # Undecorated (a root child), so getwindowgeometry reports true
               # absolute coordinates for it.  It is moved to the upper right
               # of the tiled scene, with room below and to the right of it
               # for the popups (which attach at the bar right edge, top-
               # aligned, and run up to 362px tall).
               BAR=""
               for id in $(xdotool search --name "Resound" 2>/dev/null); do
                 eval "$(xdotool getwindowgeometry --shell "$id" 2>/dev/null)"
                 if [ "${WIDTH:-0}" -ge 80 ] && [ "${WIDTH:-0}" -le 100 ] \
                    && [ "${HEIGHT:-0}" -ge 170 ] && [ "${HEIGHT:-0}" -le 190 ]; then
                   BAR=$id
                 fi
               done
               if [ -z "$BAR" ]; then
                 echo "SCENE: menu bar (86x182) not found"
                 kill -9 "$app" 2>/dev/null || true
                 return 1
               fi
               xdotool windowmove "$BAR" 1030 300
               sleep 0.5
               eval "$(xdotool getwindowgeometry --shell "$BAR" 2>/dev/null)"
               X0=$X; Y0=$Y
               echo "SCENE: bar $BAR at $X0,$Y0"

               # Baseline window list: the menu popups are nameless new windows,
               # so they are found by id diff.
               xdotool search --name "" 2>/dev/null | sort -n > /tmp/resound-shot-baseline.txt

               # Staging: openbox (Smart+center placement) puts the managed app
               # windows wherever it likes, so take the ones that could land in
               # the bar/popup zone out of it before the dances - a window over
               # the Edit row of the bar swallows the press, one over the popup
               # swallows the release. (The main model and the inspectors are
               # override-redirect, so openbox leaves them at their nib
               # positions, which fall off the canvas; the bar is unmanaged and
               # already raised.)
               tile "Tone.wav" 39 40
               tile "Console" 39 330
               xdotool windowraise "$BAR" 2>/dev/null || true

               # Tools (row 3): the real menu is ~117x102; its last row is
               # Record Format.
               SUB=""
               dance 3 80 130
               if [ -z "$(viewable_id "Record" || true)" ]; then
                 echo "SCENE: record panel missing after the tools dance"
                 kill -9 "$app" 2>/dev/null || true
                 return 1
               fi
               # The Record panel is openbox-managed: its placement may sit over
               # the Edit row of the bar, where it would swallow the press of
               # the next dance.  Move it to its final tile spot now.
               tile "Record" 359 330

               # Edit (row 2): the menu is ~147x362 (17 rows) or ~170x302
               # (14 rows); its last row is Preferences.
               SUB=""
               dance 2 300 499
               if [ -z "$(viewable_id "Preferences" || true)" ]; then
                 echo "SCENE: preferences panel missing after the edit dance (14-row layout?)"
                 kill -9 "$app" 2>/dev/null || true
                 return 1
               fi
               echo "SCENE: verified - bar, record, and preferences all present"

               # Tile the scene (frame targets; the openbox title bar keeps the
               # client areas where the tiles want them): the tone document
               # top-left, console and record below it, preferences right, menu
               # bar far right.  The remaining 1998 windows (the main model,
               # the inspectors) keep their nib positions, which fall off the
               # 1280x800 canvas.
               tile "Tone.wav" 39 40
               tile "Console" 39 330
               tile "Record" 359 330
               tile "Preferences" 679 40
               xdotool windowmove "$BAR" 1030 300
               xdotool mouseup 1 2>/dev/null || true
               # Re-paint the backdrop right before the capture: the final
               # frame must be brand purple no matter what the app or the
               # WM did to the root window along the way.
               xsetroot -solid "#666695" 2>/dev/null || true
               sleep 2

               # Capture with a pixel-level frame check: the Xvfb screen
               # buffer can be read mid-update (the scene animates - the
               # volume meter and the waveform redraw continuously), so a
               # frame can come back all-purple or all-black.  Retry a few
               # times; a scene whose frame never checks out is a failed
               # scene (the app is relaunched), never a shipped image.
               local shot=1
               for i in 1 2 3 4 5 6; do
                 import -window root -strip "$3" || break
                 if check_capture "$3"; then
                   shot=0
                   break
                 fi
                 sleep 1
               done
               if [ "$shot" -ne 0 ]; then
                 echo "SCENE: all $i capture attempts failed the frame check - scene failed"
                 rm -f "$3"
                 kill -9 "$app" 2>/dev/null || true
                 return 1
               fi
               kill "$app" 2>/dev/null || true
               sleep 1
               kill -9 "$app" 2>/dev/null || true
               return 0
             }

             ok=0
             for attempt in 1 2 3 4 5; do
               echo "================ scene attempt $attempt of 5 ================"
               if scene "$1" "$2" "$3"; then
                 ok=1
                 break
               fi
               echo "SCENE $attempt failed verification - relaunching the app"
               pkill -9 -x Resound 2>/dev/null || true
               sleep 1
             done
             if [ "$ok" -ne 1 ]; then
               rm -f "$3"
               echo "LOUD: all 5 scene attempts failed verification - no screenshot written; the publish step will skip and keep the last published image"
             fi
             exit 0
          ' _ "$EXE" "$GITHUB_WORKSPACE/test/Tone.wav" "$OUT"
          if [ -s "$OUT" ]; then
            ls -la "$OUT"
            identify "$OUT"
          else
            echo "No screenshot written - the publish step will skip it"
          fi

      - name: Publish the screenshot to the 'screenshot' branch
        # The README (on any branch) links the raw URL of the PNG on
        # this dedicated branch, so no README edit - and no rebuild -
        # is ever needed when the image changes.  Push events only
        # (fork PRs would not be able to push anyway); byte-identical
        # captures are skipped, so a stable UI costs no bot commits.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          # The push token, via the secrets context - the canonical
          # access.  (The bare $GITHUB_TOKEN in a run block expands to
          # nothing: the token is NOT auto-injected as a shell
          # environment variable, and the resulting empty token is
          # exactly the 'Invalid username or token' failure of the
          # first real run.)  The optional SCREENSHOT_PUSH_TOKEN
          # secret (a fine-grained PAT) is the fallback for when the
          # workflow token is unavailable; an undefined secret
          # interpolates to the empty string.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.SCREENSHOT_PUSH_TOKEN }}
        run: |
          set -ex
          PNG="$RUNNER_TEMP/Resound-screenshot.png"
          if [ ! -s "$PNG" ]; then
            echo "no capture from the previous step - skipping"
            exit 0
          fi
          # The capture step can be killed mid-scene (its timeout); a
          # file left behind then may be truncated.  Refuse to publish
          # anything identify cannot parse - the README would otherwise
          # link a broken image.
          if ! identify "$PNG" >/dev/null 2>&1; then
            echo "captured file is not a valid image - refusing to publish"
            exit 0
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "no push token available - skipping publish"
            exit 0
          fi
          DIR="$RUNNER_TEMP/screenshot-push"
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git config user.name "Resound Screenshot Bot"
          git config user.email "resound-screenshot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Name the (still unborn) branch before the first commit: a
          # fresh 'git init' checks out the default branch, and the
          # 'checkout -B screenshot FETCH_HEAD' below only runs when
          # the remote branch already exists - without this, the very
          # first push fails with 'src refspec screenshot does not
          # match any'.
          git checkout -q -b screenshot
          if git ls-remote --exit-code --heads origin screenshot >/dev/null 2>&1; then
            git fetch -q --depth 1 origin screenshot
            git checkout -q -B screenshot FETCH_HEAD
            if git show screenshot:Resound-screenshot.png 2>/dev/null | cmp -s - "$PNG"; then
              echo "screenshot unchanged - no bot commit"
              exit 0
            fi
          fi
          cp "$PNG" Resound-screenshot.png
          git add Resound-screenshot.png
          git commit -q -m "update app screenshot (from $GITHUB_SHA)"
          git push -q origin screenshot
          echo "published the screenshot branch"
