<p><font size=+2><b>The Amplitude Grid</b></font>

<hr noshade size=1>

<p><img src="paste.gif" width=214 height=179>

<p>Sound windows may overlay an <b>Amplitude Grid</b> over any sound.

<p><img src="../Images/CheckMark.gif" width=10 height=11> The grid may have 20, 16, or 24 points (lines), or it may have a 20-decibel logarithmic curve.&nbsp; Displayed above is a 16-point Grid, for the word &#34;Hello&#34;.

<p>To change or display the Grid, use the Marks Inspector:&nbsp; <a href="../MarksInspector.htmld/index.html"><img src="../Images/link.gif" width=10 height=10 vspace=3 border=0></a>
