#
# Continuous build of the GNUstep port of Resound (branch gnustep-port).
#
# The app is built with the same toolchain the port targets:
#   clang + libobjc2 (gnustep-2.2, non-fragile ABI), library combo
#   ng-gnu-gnu, on a source-built GNUstep stack (gnustep-make,
#   gnustep-base, gnustep-gui, gnustep-back) installed into a hermetic
#   prefix - mirroring the Gershwin /System reference install on the
#   developer machine, which the packaged GNUstep (apt) cannot provide,
#   as it is built against GCC's libobjc instead of libobjc2.
#
# The stack versions are pinned to the same source commits as the
# Gershwin install (see /Developer/Library/Repositories.csv on the dev
# box).  To update the stack, bump the pins and GNUSTEP_STACK_REV
# (which invalidates the cache).
#
name: Build

on:
  push:
    # The screenshot step publishes to this branch with the workflow
    # token; exclude it so the bot's own pushes do not re-trigger the
    # build (see docs/README_SCREENSHOT.md).
    branches-ignore:
      - screenshot
  pull_request:
  workflow_dispatch:

# The screenshot step pushes its result to the 'screenshot' branch with
# the per-run GITHUB_TOKEN, which is read-only by default; grant write
# (see docs/README_SCREENSHOT.md for the mechanics).
permissions:
  contents: write

env:
  GNUSTEP_PREFIX: ${{ github.workspace }}/gnustep

jobs:
  # The GNUmakefile-based build system only exists on branches that
  # contain the port.  The usual way to test for a file in an "if"
  # condition - hashFiles() - is a runner-side function and is only
  # permitted in step-level "if" conditions, not in a job-level one, so
  # this cheap gate job does the check on the runner and exposes the
  # result as an output.  The build job then skips itself where the
  # build system is absent (e.g. a pull request from a pre-port branch)
  # instead of spending the 20-35 minute stack build only to fail at
  # 'make -f GNUmakefile'.
  check:
    name: Detect the GNUstep build system
    runs-on: ubuntu-24.04
    outputs:
      has_build_system: ${{ steps.detect.outputs.has_build_system }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Look for the GNUmakefile
        id: detect
        run: |
          if [ -f GNUmakefile ]; then
            echo "has_build_system=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build_system=false" >> "$GITHUB_OUTPUT"
            echo "No GNUmakefile - this branch predates the GNUstep port; skipping the build."
          fi

  build:
    name: Resound (GNUstep, clang/libobjc2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: check
    if: needs.check.outputs.has_build_system == 'true'
    env:
      # Bump when the pinned commits below or the port patches applied to
      # them (patches/GNUstep-*.diff) change (invalidates the cache).
      GNUSTEP_STACK_REV: "4"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # third_party/MusicKit (the SndKit source) is a pinned
          # submodule.
          submodules: true

      - name: Restore GNUstep stack (cache)
        id: gnustep-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GNUSTEP_PREFIX }}
          key: gnustep-stack-${{ env.GNUSTEP_STACK_REV }}-noble

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm cmake git \
            autoconf automake libtool pkg-config \
            libfontconfig-dev libfreetype-dev \
            libx11-dev libxext-dev libxmu-dev libxft-dev \
            libxcursor-dev libxrandr-dev libxfixes-dev \
            libicu-dev \
            libjpeg-dev libpng-dev libtiff-dev libxml2-dev \
            libgnutls28-dev libxslt1-dev \
            portaudio19-dev libsndfile1-dev libportmidi-dev libasound2-dev \
            xvfb openbox fonts-dejavu-core \
            imagemagick xdotool

      - name: Build GNUstep stack from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          # set -e/-x/pipefail, but deliberately NOT -u: the GNUstep
          # scripts sourced below (GNUstep.sh & co.) reference
          # shell-variant variables like $ZSH_VERSION that are unset
          # under bash, and are not hardened for 'set -u'.  (Gershwin's
          # own install scripts source them under plain 'set -e'.)
          set -exo pipefail
          PREFIX="$GNUSTEP_PREFIX"
          SRC="$RUNNER_TEMP/gnustep-sources"
          rm -rf "$PREFIX" "$SRC"
          mkdir -p "$PREFIX" "$SRC"
          cd "$SRC"

          # $1 = owner/repo, $2 = full commit sha.  The download name is
          # the bare repo name: '-o' does not create parent directories,
          # so the 'owner/repo' path form would fail with a curl write
          # error.  (tar extracts to '<repo>-<sha>/' regardless.)
          fetch() {
            local repo="$1" sha="$2"
            curl -fsSL -o "${repo##*/}.tar.gz" "https://github.com/$repo/archive/$sha.tar.gz"
            tar xzf "${repo##*/}.tar.gz"
          }

          # 1. libobjc2 - the GNUstep Objective-C runtime (CMake build).
          #    Built first so that gnustep-make's configure can detect it
          #    (ng runtime) and link its blocks test against it.
          #
          #    GNUSTEP_INSTALL_TYPE=NONE, deliberately not SYSTEM: the
          #    SYSTEM domain asks 'gnustep-config' (from gnustep-make,
          #    built next - it does not exist yet) for the install paths,
          #    and when the program is missing CMake 3.28+ fails with
          #    "install FILES given no DESTINATION".  NONE installs
          #    relative to CMAKE_INSTALL_PREFIX (bin/, lib/, include/) -
          #    exactly the same hermetic layout the SYSTEM domain would
          #    give once this prefix is in place.
          fetch gnustep/libobjc2 c9f4002ade04d755f2a0e6c83daf2738dca03759
          cd libobjc2-c9f4002ade04d755f2a0e6c83daf2738dca03759
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DGNUSTEP_INSTALL_TYPE=NONE \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DTESTS=OFF
          cmake --build build -j"$(nproc)"
          cmake --install build
          cd "$SRC"

          # 2. gnustep-make (the makefiles, GNUstep.sh, gnustep-config,
          #    plmerge, pl2link, ...).  ng-gnu-gnu = gnustep (libobjc2)
          #    runtime + GNUstep base + GNUstep gui.
          fetch gnustep/tools-make 4e31a0310df5f0aa96ccd816d3b626e67c36f535
          cd tools-make-4e31a0310df5f0aa96ccd816d3b626e67c36f535
          # Make the just-installed libobjc2 discoverable to configure:
          # its run tests need the shared library at runtime, and its
          # pkg-config probe needs the .pc file.  (Later components get
          # this automatically from the prefix's GNUstep.sh, which does
          # not exist yet - it is installed by this very step.)
          export LD_LIBRARY_PATH="$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure \
            --prefix="$PREFIX" \
            --with-library-combo=ng-gnu-gnu \
            --with-runtime-abi=gnustep-2.2 \
            CC=clang CXX=clang++ \
            CPPFLAGS="-I$PREFIX/include" LDFLAGS="-L$PREFIX/lib"
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # From here on, everything configures against the freshly
          # installed stack: its GNUstep.sh points at the prefix.
          export GNUSTEP_CONFIG_FILE="$PREFIX/etc/GNUstep/GNUstep.conf"
          . "$PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM

          # 3. gnustep-base (Foundation).
          fetch gnustep/libs-base 5bda52220a6d67382c9851cdfd91d459bfd2b489
          cd libs-base-5bda52220a6d67382c9851cdfd91d459bfd2b489
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure --disable-libdispatch CC=clang CXX=clang++
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # 4. gnustep-gui (AppKit).
          fetch gnustep/libs-gui 8f804fd520c60800961e0bee072066f4bbadca94
          cd libs-gui-8f804fd520c60800961e0bee072066f4bbadca94
          # Port patches (patches/GNUstep-0002/0003, documented in
          # docs/UPSTREAM_PATCHES.md): the pasteboard wrapper/target
          # lifetimes, and deterministic .gorm serialization of the
          # container's top-level collections.  (GNUstep-0001, the
          # released-when-closed default, was retired 2026-11-11: the
          # maintainer declined the change, and the audit of the built
          # sources shows nothing the build compiles needs it - see
          # the G1 section.)  Failing to apply fails the build, like
          # the MusicKit patches (set -e above).
          patch -p1 --dry-run < "${GITHUB_WORKSPACE}/patches/GNUstep-0002-nspasteboard-retained-wrapper-map.diff"
          patch -p1 --dry-run < "${GITHUB_WORKSPACE}/patches/GNUstep-0003-gsnibcontainer-deterministic-serialization.diff"
          patch -p1 --forward < "${GITHUB_WORKSPACE}/patches/GNUstep-0002-nspasteboard-retained-wrapper-map.diff"
          patch -p1 --forward < "${GITHUB_WORKSPACE}/patches/GNUstep-0003-gsnibcontainer-deterministic-serialization.diff"
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure CC=clang CXX=clang++
          make -j"$(nproc)"
          make install
          cd "$SRC"

          # 5. gnustep-back (X11 backend; needed for the launch check).
          fetch gnustep/libs-back bbcc3de7cab63b6e65944edf02f2bbef9d8a7bbd
          cd libs-back-bbcc3de7cab63b6e65944edf02f2bbef9d8a7bbd
          # Release trees ship the prebuilt configure that Gershwin's build
          # (and the sandbox rehearsal) ran; regenerate only if missing.
          [ -f configure ] || { aclocal && autoconf; }
          ./configure CC=clang CXX=clang++
          make -j"$(nproc)"
          make install

          # Sanity: the runtime pieces must be in the prefix.
          ls "$PREFIX/lib" | grep -E "^(libobjc|libgnustep)" | sort

      - name: Save GNUstep stack (cache)
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GNUSTEP_PREFIX }}
          key: gnustep-stack-${{ env.GNUSTEP_STACK_REV }}-noble

      - name: Build SndKit frameworks (MusicKit)
        # SndKit + its portaudio performance backend, from the pinned
        # third_party/MusicKit submodule (see docs/GNUSTEP_BUILD.md).
        #
        # This runs *after* the cache save on purpose: the frameworks
        # install into the same hermetic prefix, and keeping them out of
        # the cached prefix means every run builds them fresh from the
        # pinned submodule (a couple of minutes) instead of trusting a
        # cached copy that would go stale when the submodule is bumped.
        # The expensive stack (above) stays cached.
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables
          # (see the stack build step).
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          bash third_party/build-sndkit.sh

      - name: SndKit smoke test
        # Functional check of the freshly built frameworks: load a
        # .wav, write an .au, reload it - pure libsndfile file I/O, no
        # audio device or display needed, so it is safe to make fatal.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name sndsmoke | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          OUT="$RUNNER_TEMP/sndsmoke-out.au"
          "$TOOL" test/Tone.wav "$OUT"
          ls -la "$OUT"

      - name: File I/O contract tests (Phase 1)
        # The Sound (ResoundSound) category's intended behaviour, pinned
        # test-first by test/resoundio.m (the Rhapsody original cannot
        # run, so the tests define the SndKit contract; see
        # docs/RESOUND_SNDKIT_PLAN.md, Phase 1): loading every format,
        # the convertOnOpen normalisation, save/backup/info-string
        # round trips and the failure paths.  Headless and fatal.
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundio | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          WORK="$RUNNER_TEMP/resoundio"
          mkdir -p "$WORK"
          "$TOOL" test/Tone.wav "$WORK"

      - name: Build the app
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables
          # (see the stack build step).
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          make -j"$(nproc)" -f GNUmakefile
          find Resound.app -maxdepth 3 | sort

      - name: NIB conversion format check
        # Every 1998 .nib in the tree has a converted .gorm twin
        # (gormtool, gnustep/apps-gorm branch OPENSTEP_nib_support); the
        # 1998 folders stay in place as the source of the stepwise
        # re-nib migration.  This verifies the asset format - the GNUstep
        # archive magic and the class description of every .gorm, in the
        # tree and in the freshly built bundle.  Headless and fatal.
        # (The runtime load half of the test, --load, needs a display and
        # runs locally; see docs/RESOUND_SNDKIT_PLAN.md, NIB migration.)
        run: |
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          make -C test -j"$(nproc)"
          TOOL=$(find test -type f -name resoundnib | head -n 1)
          test -n "$TOOL"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$TOOL" --check . Resound.app/Resources

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Resound.app
          path: Resound.app

      - name: Launch check (non-fatal)
        # The app starts with its 1998 main window (the converted main
        # model is live at startup) and then just sits in its event loop
        # until the timer fires: exit 124 is a pass.
        # Non-fatal for now so that a flaky display environment can not
        # mask a build result; the build step is the hard gate.
        #
        # openbox provides the window manager that bare xvfb lacks:
        # gnustep-back waits for the WM to map the window (and queries
        # its _NET_WORKAREA), logging a warning per second without one.
        # With a minimal WM the check measures what a real desktop does
        # (a mapped, visible window) - what will matter once the app
        # has its main nib.  Killing the app from the outside (timeout)
        # always leaves a cosmetic 'XIO: fatal IO error' line from
        # libX11; that is teardown noise, not a failure.
        continue-on-error: true
        run: |
          EXE=$(find Resound.app -type f -name Resound | head -n 1)
          test -n "$EXE"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rc=0
          timeout 10 xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$EXE" || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "launch check passed (rc=$rc)"
          else
            echo "launch check failed (rc=$rc)"
            exit "$rc"
          fi

      - name: Capture app screenshot (for the README)
        # The real app under xvfb + openbox; the *whole screen* is
        # captured with ImageMagick, so that every window the app shows
        # up is in the picture.  The app comes up with its 1998 main
        # window and menu (the converted main model is live at startup),
        # and the same capture shows the UI further as the ported units
        # land; the publish step below ships it to the 'screenshot'
        # branch that the README links (docs/README_SCREENSHOT.md).
        # Non-fatal, like the launch check: a flaky display must not mask
        # a build result.  (A per-window capture does not work: app
        # windows can fail ImageMagick's XGetImage with a bad resource
        # while the root window is always capturable.)
        continue-on-error: true
        run: |
          # Not -u: GNUstep.sh references unset shell-variant variables.
          set -ex
          export GNUSTEP_CONFIG_FILE="$GNUSTEP_PREFIX/etc/GNUstep/GNUstep.conf"
          . "$GNUSTEP_PREFIX/share/GNUstep/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$GNUSTEP_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          EXE=$(find Resound.app -type f -name Resound | head -n 1)
          test -n "$EXE"
          OUT="$RUNNER_TEMP/Resound-screenshot.png"
          timeout 60 xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            openbox >/dev/null 2>&1 &
            sleep 1
            "$1" >/dev/null 2>&1 &
            app=$!
            # Readiness gate: wait for the app to have at least one
            # window, then give it a moment to draw.
            ready=0
            for i in $(seq 1 30); do
              if [ -n "$(xdotool search --name Resound 2>/dev/null | head -n 1 || true)" ]; then
                ready=1
                break
              fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then
              echo "no app window appeared - no capture"
              kill "$app" 2>/dev/null || true
              exit 1
            fi
            sleep 2
            import -window root -strip "$2"
            kill "$app" 2>/dev/null || true
          ' _ "$EXE" "$OUT"
          ls -la "$OUT"
          identify "$OUT"

      - name: Publish the screenshot to the 'screenshot' branch
        # The README (on any branch) links the raw URL of the PNG on
        # this dedicated branch, so no README edit - and no rebuild -
        # is ever needed when the image changes.  Push events only
        # (fork PRs would not be able to push anyway); byte-identical
        # captures are skipped, so a stable UI costs no bot commits.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          # The push token, via the secrets context - the canonical
          # access.  (The bare $GITHUB_TOKEN in a run block expands to
          # nothing: the token is NOT auto-injected as a shell
          # environment variable, and the resulting empty token is
          # exactly the 'Invalid username or token' failure of the
          # first real run.)  The optional SCREENSHOT_PUSH_TOKEN
          # secret (a fine-grained PAT) is the fallback for when the
          # workflow token is unavailable; an undefined secret
          # interpolates to the empty string.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.SCREENSHOT_PUSH_TOKEN }}
        run: |
          set -ex
          PNG="$RUNNER_TEMP/Resound-screenshot.png"
          if [ ! -s "$PNG" ]; then
            echo "no capture from the previous step - skipping"
            exit 0
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "no push token available - skipping publish"
            exit 0
          fi
          DIR="$RUNNER_TEMP/screenshot-push"
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git config user.name "Resound Screenshot Bot"
          git config user.email "resound-screenshot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Name the (still unborn) branch before the first commit: a
          # fresh 'git init' checks out the default branch, and the
          # 'checkout -B screenshot FETCH_HEAD' below only runs when
          # the remote branch already exists - without this, the very
          # first push fails with 'src refspec screenshot does not
          # match any'.
          git checkout -q -b screenshot
          if git ls-remote --exit-code --heads origin screenshot >/dev/null 2>&1; then
            git fetch -q --depth 1 origin screenshot
            git checkout -q -B screenshot FETCH_HEAD
            if git show screenshot:Resound-screenshot.png 2>/dev/null | cmp -s - "$PNG"; then
              echo "screenshot unchanged - no bot commit"
              exit 0
            fi
          fi
          cp "$PNG" Resound-screenshot.png
          git add Resound-screenshot.png
          git commit -q -m "update app screenshot (from $GITHUB_SHA)"
          git push -q origin screenshot
          echo "published the screenshot branch"
