<p><font size=+2><b>The Zero Line</b></font>

<hr noshade size=1>

<p><img src="paste.gif" width=214 height=179>

<p>Sound windows may overlay a <b>Zero Line</b> over any sound.

<p><img src="../Images/CheckMark.gif" width=10 height=11> The Zero Line above is the gray horizontal line running through the sound.

<p>To change or display the Zero Line, use the Marks Inspector:&nbsp; <a href="../MarksInspector.htmld/index.html"><img src="../Images/link.gif" width=10 height=10 vspace=3 border=0></a>
